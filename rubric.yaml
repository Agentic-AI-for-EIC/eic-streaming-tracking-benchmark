# MLCommons Science Benchmarks Ontology -- rating rubric checklist for the
# EIC Streaming Tracking Benchmark.
#
# Scored from the material available on Indico as of 26 Aug 2026 (see README.md
# "Sources"). This is a self-score of a WORKING DRAFT, not a finished benchmark -- several
# items are marked false because the underlying artifact (published code, a frozen split,
# an accessible dataset) genuinely does not exist yet, not because the idea behind it is
# unsound. See each `evidence:` field for the specific gap.

benchmark_name: "EIC Streaming Tracking Benchmark"
scored_date: "2026-08-26"
notes: >
  Self-scored immediately after drafting the benchmark card from Indico materials
  (Genesis Mission Phase I proposal + Aug 2026 project meetings). The reference solution
  is the rule-based EICrecon central tracking (public, LGPL-3.0) -- UNCONFIRMED: named by
  the benchmark owner, not yet built, run, or read for this benchmark, and it has no
  benchmark results yet. HEPTv2 (originally the reference; code not public) is now an AI
  comparison entry. Items below that depend on actually running the reference are false.

# --- Category 1: Software Environment (1 point per true item, max 5) ---
software_environment:
  - id: code_available
    description: "The code is available to reproduce the baseline reference solution."
    met: true
    evidence: "EICrecon is public (github.com/eic/EICrecon, LGPL-3.0). UNCONFIRMED: not built or run; benchmark-specific run recipe does not exist yet."
  - id: code_complete
    description: "The provided code is complete."
    met: false
    evidence: "UNCONFIRMED: EICrecon not inspected or run; no benchmark-specific run/scoring pipeline exists yet."
  - id: code_documented
    description: "The code itself is well documented."
    met: false
    evidence: "UNCONFIRMED: EICrecon has public docs (eic.github.io/EICrecon) but its tracking code and docs were not reviewed."
  - id: code_runs_unmodified
    description: "The code does not require any modifications to run."
    met: false
    evidence: "UNCONFIRMED: not run."
  - id: env_specified
    description: "The environment is either containerized, or environment details and setup instructions are provided."
    met: false
    evidence: "eic-shell 26.05 / eicrecon 26.07.1 named (reference_solution/README.md) but not confirmed as the reference-run versions, and not consolidated into a pinned environment file or container."

# --- Category 2: Problem Specification and Constraints (1 point per true item, max 5) ---
problem_specification:
  - id: constraints_provided
    description: "System constraints (power, latency, throughput, etc.) are provided."
    met: true
    evidence: "README.md Section 1 constraints table: 0.6ms latency and a computed ~1.4 Tb/s (~171 GB/s) approximate input data rate derived from window size and feature count."
  - id: task_clear
    description: "The benchmark task is clear."
    met: true
    evidence: "README.md Section 1: RECONSTRUCT + TAG sub-tasks stated concretely with target definition."
  - id: dataset_format_specified
    description: "The dataset format is clearly specified."
    met: true
    evidence: "data/SCHEMA.md: EDM4eic/PODIO, ROOT, Rucio DID access documented."
  - id: inputs_specified
    description: "The task inputs are clearly specified."
    met: true
    evidence: "data/SCHEMA.md: exact 15-feature-per-hit input vector table."
  - id: outputs_specified
    description: "The task outputs are clearly specified."
    met: true
    evidence: "README.md Section 1 Outputs: per-event hit-to-track mask set + signal-membership score."

# --- Category 3: Dataset (4 FAIR points + 1 splits point, max 5) ---
dataset:
  fair:
    - id: findable
      description: "Each instance is uniquely identified and documented (Findable)."
      met: true
      evidence: "README.md Dataset FAIR checklist: Rucio DID per file, truth chain traces every hit to a unique MCParticle/event."
    - id: accessible
      description: "Access is provided through persistent, open protocols (Accessible)."
      met: false
      evidence: "README.md: access is via EIC/ePIC-collaboration Rucio infrastructure only, not a public/open protocol; DOE-sanctioned public sharing 'subject to DOE guidance' has not happened yet."
    - id: interoperable
      description: "Formats and metadata follow community standards (Interoperable)."
      met: true
      evidence: "EDM4eic/PODIO is the EIC collaboration's own standard data model for reconstructed output -- data/SCHEMA.md."
    - id: reusable
      description: "Versioning with associated preprocessing scripts enables full reproducibility (Reusable)."
      met: false
      evidence: "data/SCHEMA.md: the raw-to-filtered-schema extraction script is described but not yet a published, versioned artifact."
  splits_defined:
    description: "A canonical, non-overlapping train/validation/test split is provided."
    met: false
    evidence: "README.md Dataset Splits table: only ad hoc splits from one training run exist (495/49/5415-event samples); proposal's own Month 1-2 milestone to finalize splits has not occurred yet."

# --- Category 4: Performance Metrics (Definitions 0-3 + Quality 0-2, max 5) ---
performance_metrics:
  definition_level: 3
  definition_evidence: "README.md Section 3: every metric (per-hit/per-track AUROC, double majority, technical efficiency, fake rate, compression ratio, signal retention) has an exact formula with worked numeric evidence from the reference solution's own reported results."
  quality_level: 2
  quality_evidence: "Metric suite jointly captures physics correctness (DM/efficiency/fake-rate/AUROC) AND deployability (bit-operations, latency as a hard constraint) -- matches the benchmark's stated dual goal of physics-preserving AND deployable models, not physics accuracy alone."

# --- Category 5: Reference Solution (1 point per true item, max 5) ---
reference_solution:
  - id: publicly_available
    description: "A reference solution is publicly available."
    met: true
    evidence: "EICrecon is public and LGPL-3.0 (github.com/eic/EICrecon). UNCONFIRMED that its tracking chain is the exact reference configuration."
  - id: well_documented
    description: "The provided reference solution is well documented."
    met: false
    evidence: "UNCONFIRMED: reference_solution/README.md describes it only from the owner's description and public pages; no run recipe or results."
  - id: requirements_listed
    description: "All hardware and/or software requirements to run the reference solution are listed."
    met: true
    evidence: "reference_solution/README.md Requirements: eic-shell/eicrecon versions named (UNCONFIRMED for the reference run); hardware/latency requirements are [GAP]."
  - id: metrics_evaluated
    description: "All metrics defined as part of the benchmark are evaluated as part of the reference solution."
    met: false
    evidence: "No metric has been evaluated for the reference yet (it has not been run); Robustness additionally needs >=3 background-rate conditions."
  - id: baseline_open
    description: "The baseline solution/model is openly available for study (architecture, hyperparameters, and training code if a neural network)."
    met: true
    evidence: "Rule-based, no training: the algorithm is open source (EICrecon). UNCONFIRMED: exact algorithm/config parameters not yet read from the source."

# --- Category 6: Documentation (1 point per true item, max 5) ---
documentation:
  - id: task_explained
    description: "The task is explained and well documented."
    met: true
    evidence: "README.md Section 1, plus data/SCHEMA.md target definition."
  - id: background_explained
    description: "The task and benchmark background (scientific and otherwise) is clearly explained."
    met: true
    evidence: "README.md Section 5 Background: EIC occupancy problem, sPHENIX precedent, SVT noise-study context."
  - id: motivation_explained
    description: "The motivation for the benchmark is clearly explained."
    met: true
    evidence: "README.md Section 5 Motivation: streaming-readout-with-no-trigger argument, physics-reach impact."
  - id: evaluation_explained
    description: "The evaluation criteria are clearly explained."
    met: true
    evidence: "README.md Section 3 (metric definitions) cross-referenced from Section 5 Evaluation criteria."
  - id: paper_exists
    description: "An academic paper about the benchmark exists."
    met: false
    evidence: "README.md Section 5: closest artifact is the DOE Genesis Mission funding proposal, not a benchmark paper."

# --- Motif tagging (not scored, but expected metadata) ---
motifs:
  scientific_motifs: ["Nuclear Physics"]
  ai_ml_motif: "Classification"
  computing_motifs: ["Latency Bound", "Memory Bound", "Throughput Bound"]
