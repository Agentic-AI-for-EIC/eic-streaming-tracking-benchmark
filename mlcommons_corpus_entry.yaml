  name: "EIC Streaming Tracking Benchmark"
  url: "https://github.com/Agentic-AI-for-EIC/eic-streaming-tracking-benchmark"
  # doi: omitted -- none exists yet

  domain:
    - "Nuclear Physics"

  focus: >
    Given an unordered ~2 microsecond window of ePIC central-tracker hits containing
    exactly one buried DIS physics event on top of continuous beam/synchrotron
    background, reconstruct the tracks belonging to that event (the task) and tag
    which reconstructed objects are signal rather than overlay (the task's other
    half), scored against the metrics defined in Section 3 (Double Majority,
    technical efficiency, fake rate, per-hit/per-track AUROC, compression ratio,
    signal retention) while satisfying fixed system constraints: <=0.6 ms end-to-end
    latency, a path to fixed-point FPGA firmware, and an approximate ~1.4 Tb/s
    (~171 GB/s) sustained input data rate computed from the ~5,700-hit/window,
    15-feature-per-hit input over the 2 microsecond window.

  keywords:
    - "particle tracking"
    - "streaming readout"
    - "point transformer"
    - "quantization"
    - "pruning"
    - "FPGA deployment"
    - "electron-ion collider"
    - "ePIC"

  summary: |
    The EIC's innermost silicon tracking layers face synchrotron/beam-gas background
    occupancy roughly three orders of magnitude above the true deep-inelastic-scattering
    (DIS) signal rate, and ePIC's streaming readout has no hardware trigger to filter this
    inline. This benchmark asks a model to jointly (a) group an unordered set of tracker
    hits into tracks belonging to the one true signal event in the window, and (b) tag
    signal vs. background hits/tracks using relative-timing coincidence (not geometry
    alone), while satisfying a hard deployability budget: <=0.6 ms end-to-end latency, a
    path to fixed-point FPGA firmware, and an approximate ~1.4 Tb/s (~171 GB/s) sustained
    input data rate (computed from ~5,700 hits/window x 15 features/hit over the 2 us
    window -- see README.md Section 1 for the full derivation and its assumptions). It is
    a multi-dimensional (Pareto) benchmark --
    physics-quality metrics (Double Majority, technical efficiency, fake rate, per-hit/
    per-track AUROC) are compared at a fixed resource/latency budget, not traded off
    against it freely. The reference solution is the rule-based (non-AI) central tracking in
    EICrecon (public, LGPL-3.0); it does not meet the latency/bandwidth constraints and
    serves as the accuracy baseline. It is UNCONFIRMED: not yet built or run for this
    benchmark, so no reference results exist. HEPTv2 (an LSH point transformer adapted from
    CMS L1-trigger HEPT; slide-deck results per-hit AUROC 0.992, Double Majority 0.597, 211x
    fewer bit-operations) is an AI comparison entry. This is a working draft: canonical
    dataset splits are not yet frozen -- see README.md for the full, evidence-cited gap list.

